[platformio]
default_envs = seeed_wio_terminal
include_dir = include

[env:seeed_wio_terminal]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/patch_rpcwifi.py
build_src_filter =
  +<*>
  -<font_installer.cpp>
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  khoih-prog/FlashStorage_SAMD@^1.3.2
  https://github.com/Seeed-Studio/Seeed_Arduino_rpcWiFi.git
  https://github.com/Seeed-Studio/Seeed_Arduino_rpcUnified.git
  https://github.com/Seeed-Studio/Seeed_Arduino_mbedtls.git
  https://github.com/Seeed-Studio/Seeed_Arduino_RTC.git
  https://github.com/Seeed-Studio/Seeed_Arduino_SFUD.git
  lvgl/lvgl@8.3.11

build_flags =
  -D ARDUINOJSON_ENABLE_STD_STRING=0
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_14=1
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_20=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  -std=gnu++17
  -Iinclude
build_src_filter =
  -<*>
  +<application/task_service.cpp>
  +<application/reminder_engine.cpp>
  +<application/clock.cpp>
  +<infrastructure/crc32.cpp>

[env:font_installer]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/Seeed-Studio/Seeed_Arduino_SFUD.git
build_src_filter =
  -<*>
  +<font_installer.cpp>
